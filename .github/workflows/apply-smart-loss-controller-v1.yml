name: Apply Smart Loss Controller V1 patch

on:
  push:
    branches:
      - cursor/smart-loss-controller-v1
    paths:
      - '.github/workflows/apply-smart-loss-controller-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: cursor/smart-loss-controller-v1
          fetch-depth: 0

      - name: Reconstruct, repair paste transport, and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-slc-xz/part-*.b64 > /tmp/smart-loss-controller-v1.xz.b64
          base64 -d /tmp/smart-loss-controller-v1.xz.b64 > /tmp/smart-loss-controller-v1.xz
          test "$(wc -c < /tmp/smart-loss-controller-v1.xz | tr -d ' ')" = "12652"
          test "$(sha256sum /tmp/smart-loss-controller-v1.xz | awk '{print $1}')" = "f0203045bc0609dfe79b4153178cf2ad4062c3f09a3f302a2942216a578aa6c7"
          xz -dc /tmp/smart-loss-controller-v1.xz > /tmp/smart-loss-controller-v1.raw.patch
          test "$(wc -c < /tmp/smart-loss-controller-v1.raw.patch | tr -d ' ')" = "68223"
          test "$(sha256sum /tmp/smart-loss-controller-v1.raw.patch | awk '{print $1}')" = "6669a30b3855c5186f10a792de32473d17d908348c4162b9c10c6153cc202dfb"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/smart-loss-controller-v1.raw.patch').read_text()
          bad1 = '   GhFastOpenTrade,\n\n   GhFastSide,'
          good1 = '   GhFastOpenTrade,\n   GhFastSide,'
          bad2 = '+    const windowMs = Math.max(1_000, this.pipeline.config().antiChurnCi\nrcuitBreakerWindowMs);'
          good2 = '+    const windowMs = Math.max(1_000, this.pipeline.config().antiChurnCircuitBreakerWindowMs);'
          assert p.count(bad1) == 1, p.count(bad1)
          assert p.count(bad2) == 1, p.count(bad2)
          p = p.replace(bad1, good1, 1).replace(bad2, good2, 1)
          Path('/tmp/smart-loss-controller-v1.patch').write_text(p)
          PY
          bytes="$(wc -c < /tmp/smart-loss-controller-v1.patch | tr -d ' ')"
          sha="$(sha256sum /tmp/smart-loss-controller-v1.patch | awk '{print $1}')"
          echo "Repaired patch bytes: $bytes"
          echo "Repaired patch sha256: $sha"
          test "$bytes" = "68221"
          test "$sha" = "9c83f9dd8ed675332a268d05d67170f246529f4a9e25eaa9fc526c3048c4a4a1"
          test "$(grep -c '^diff --git ' /tmp/smart-loss-controller-v1.patch)" = "14"
          git apply --recount --check /tmp/smart-loss-controller-v1.patch
          stats="$(git apply --numstat --recount /tmp/smart-loss-controller-v1.patch)"
          echo "$stats"
          test "$(echo "$stats" | awk '{a+=$1; d+=$2} END{print a}')" = "1029"
          test "$(echo "$stats" | awk '{a+=$1; d+=$2} END{print d}')" = "75"

      - name: Apply exact repaired patch and remove transport staging
        shell: bash
        run: |
          set -euo pipefail
          git apply --recount /tmp/smart-loss-controller-v1.patch
          rm -rf .tmp-slc .tmp-slc-xz
          rm -f .github/workflows/apply-smart-loss-controller-v1.yml
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "14"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add SMART_LOSS_CONTROLLER_V1 with conservative guards"
          git push origin HEAD:cursor/smart-loss-controller-v1
