name: Web PWA

on:
  pull_request:
    branches:
      - main
      - cursor/production-connection
      - cursor/webhook-delivery-400-c2c2
  push:
    branches:
      - main
      - cursor/production-connection

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8080
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: example-project
      VITE_FIREBASE_APP_ID: 1:000000000000:web:test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
