name: Backend

on:
  push:
    branches: [main, cursor/production-connection]
  pull_request:
    branches:
      - main
      - cursor/production-connection
      - cursor/webhook-delivery-400-c2c2
      - cursor/phase3-stage3-live-forward-c2c2
      - cursor/goldmeta-v4-stage-b-c2c2
      - cursor/v5-4-3-approved-base-c2c2

jobs:
  owner-auth-deploy-gate:
    name: Owner Auth pre-deploy gate (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Static gate — workflows must not invoke owner restore
        working-directory: backend
        run: npx vitest run tests/unit/auth/deployMustNotRestoreOwner.test.ts
        env:
          NODE_ENV: test
          APP_ENV: test
          STORAGE_BACKEND: memory
          GOLDMETA_PINNED_OWNER_UID: testPinnedOwnerUid000000000001
          GOLDMETA_OWNER_EMAIL: saviosyl@gmail.com

      - name: Authenticate to Google Cloud
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pre-deploy owner Auth health gate
        if: ${{ steps.gcp_auth.outcome == 'success' && secrets.GOLDMETA_PINNED_OWNER_UID != '' }}
        working-directory: backend
        env:
          GOLDMETA_OWNER_EMAIL: saviosyl@gmail.com
          GOLDMETA_PINNED_OWNER_UID: ${{ secrets.GOLDMETA_PINNED_OWNER_UID }}
          GCLOUD_PROJECT: goldmeta-web
          GOOGLE_CLOUD_PROJECT: goldmeta-web
        run: |
          npm run gate:owner-auth-deploy | sed -E 's/([A-Za-z0-9_-]{4})[A-Za-z0-9_-]{12,}([A-Za-z0-9_-]{4})/\1…\2/g'

      - name: Note when live gate skipped
        if: ${{ steps.gcp_auth.outcome != 'success' || secrets.GOLDMETA_PINNED_OWNER_UID == '' }}
        run: echo "Live owner Auth gate skipped (missing GCP auth or pinned UID secret). Static restore-script check still passed."

  backend:
    runs-on: ubuntu-latest
    needs: [owner-auth-deploy-gate]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          APP_ENV: test
          STORAGE_BACKEND: memory

      - name: Firestore Emulator concurrency tests
        run: |
          npx --yes firebase-tools@13 emulators:exec --only firestore --project goldmeta-signal-outcome-test \
            "npx vitest run tests/integration/signalOutcome.firestore.emulator.test.ts"
        env:
          NODE_ENV: test
          APP_ENV: test
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8081
          GCLOUD_PROJECT: goldmeta-signal-outcome-test
          GOOGLE_CLOUD_PROJECT: goldmeta-signal-outcome-test

      - name: Build
        run: npm run build
