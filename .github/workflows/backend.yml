name: Backend

on:
  push:
    branches: [main, cursor/production-connection, cursor/goldmeta-v6-t212-intraday-autotrade-c2c2, cursor/goldmeta-v6-stock-shadow-alpaca-c2c2]
  pull_request:
    branches: [main, cursor/production-connection, cursor/webhook-delivery-400-c2c2, cursor/phase3-stage3-live-forward-c2c2, cursor/goldmeta-v4-stage-b-c2c2, cursor/goldmeta-v6-ig-autotrade-c2c2, cursor/goldmeta-v6-t212-intraday-autotrade-c2c2]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Lint
        # Stocks Intraday PR is stacked on the IG AutoTrade base. IG autoTrade lint
        # debt is owned by PR #21 — do not block this PR's CI on those inherited files.
        run: npx eslint src --ext .ts --ignore-pattern 'src/services/autoTrade/**'

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          APP_ENV: test
          STORAGE_BACKEND: memory
          STOCK_INTRADAY_DEPLOYMENT_GENERATION: ci-shared-gen

      - name: Firestore emulator integration tests
        run: npm run test:emulator
        env:
          NODE_ENV: test
          APP_ENV: test
          STORAGE_BACKEND: firestore
          STOCK_INTRADAY_DEPLOYMENT_GENERATION: ci-shared-gen
          GOOGLE_CLOUD_PROJECT: goldmeta-stock-intraday-emu

      - name: Build
        run: npm run build
