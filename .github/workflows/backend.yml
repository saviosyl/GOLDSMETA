name: Backend

on:
  push:
    branches: [main, cursor/production-connection, cursor/live-xauusd-price-e1a2]
  pull_request:
    branches:
      - main
      - cursor/production-connection
      - cursor/webhook-delivery-400-c2c2
      - cursor/phase3-stage3-live-forward-c2c2
      - cursor/goldmeta-v4-stage-b-c2c2
      - cursor/v5-4-3-approved-base-c2c2
  workflow_dispatch:

jobs:
  # A. Required CI — always runs; no production secrets required.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (includes owner safeguards, password-reset, webhook gate)
        run: npm test
        env:
          NODE_ENV: test
          APP_ENV: test
          STORAGE_BACKEND: memory
          GOLDMETA_PINNED_OWNER_UID: testPinnedOwnerUid000000000001
          GOLDMETA_OWNER_EMAIL: saviosyl@gmail.com

      - name: Micro Edge — import boundary + broker mutation ban
        run: npm run gate:micro-edge-imports && npm run gate:micro-edge-mutations

      - name: Micro Edge — protected Core unchanged vs PR base
        if: github.event_name == 'pull_request'
        run: npm run gate:micro-edge-core
        env:
          MICRO_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Micro Edge unit tests
        run: npm run test:micro-edge
        env:
          NODE_ENV: test
          APP_ENV: test
          STORAGE_BACKEND: memory
          MICRO_BROKER_EXECUTION_ENABLED: "false"

      - name: Static gate — workflows must not invoke owner restore
        run: npx vitest run tests/unit/auth/deployMustNotRestoreOwner.test.ts
        env:
          NODE_ENV: test
          APP_ENV: test
          STORAGE_BACKEND: memory
          GOLDMETA_PINNED_OWNER_UID: testPinnedOwnerUid000000000001
          GOLDMETA_OWNER_EMAIL: saviosyl@gmail.com

      - name: Firestore Emulator concurrency tests
        run: |
          npx --yes firebase-tools@13 emulators:exec --only firestore --project goldmeta-signal-outcome-test \
            "npx vitest run tests/integration/signalOutcome.firestore.emulator.test.ts"
        env:
          NODE_ENV: test
          APP_ENV: test
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8081
          GCLOUD_PROJECT: goldmeta-signal-outcome-test
          GOOGLE_CLOUD_PROJECT: goldmeta-signal-outcome-test

      - name: Build
        run: npm run build

  # B. Optional credential-dependent live gate — never fails required CI when secrets absent.
  # Do not use production secrets for pull requests from forks.
  owner-auth-live-gate:
    name: Owner Auth live gate (optional, read-only)
    runs-on: ubuntu-latest
    needs: [backend]
    # Same-repo PRs / pushes only — never expose production secrets to forks.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Authenticate to Google Cloud
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Resolve pinned UID secret availability
        id: pinned
        env:
          PINNED_UID: ${{ secrets.GOLDMETA_PINNED_OWNER_UID }}
        run: |
          if [ -n "${PINNED_UID}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-deploy owner Auth health gate
        if: steps.gcp_auth.outcome == 'success' && steps.pinned.outputs.present == 'true'
        working-directory: backend
        env:
          GOLDMETA_OWNER_EMAIL: saviosyl@gmail.com
          GOLDMETA_PINNED_OWNER_UID: ${{ secrets.GOLDMETA_PINNED_OWNER_UID }}
          GCLOUD_PROJECT: goldmeta-web
          GOOGLE_CLOUD_PROJECT: goldmeta-web
        run: |
          npm run gate:owner-auth-deploy

      - name: Skip note when credentials unavailable
        if: steps.gcp_auth.outcome != 'success' || steps.pinned.outputs.present != 'true'
        run: |
          echo "SKIPPED — live owner Auth gate (missing GCP auth and/or pinned UID secret)."
          echo "Required Backend unit CI already passed independently."
