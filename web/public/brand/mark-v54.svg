<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="GoldMeta">
  <!-- Approved mark: navy G ring + gold M with chart/circuit accents -->
  <rect width="128" height="128" rx="28" fill="#FFFFFF"/>
  <!-- G ring -->
  <path
    d="M64 18c-25.4 0-46 20.6-46 46s20.6 46 46 46c14.2 0 26.9-6.4 35.2-16.5l-9.8-8.2C83.4 92.8 74.2 98 64 98c-18.8 0-34-15.2-34-34s15.2-34 34-34c11.4 0 21.4 5.6 27.6 14.2l9.6-8.6C93.2 24.4 79.6 18 64 18z"
    fill="#11284A"
  />
  <!-- open gap accent on right of G -->
  <path d="M98 54c2.4 3.8 3.8 8.2 3.8 13 0 4.2-1 8.2-2.8 11.7" fill="none" stroke="#11284A" stroke-width="10" stroke-linecap="round"/>
  <!-- gold M -->
  <path
    d="M42 86V46h12.2l9.8 24.6L73.8 46H86v28.5L98 58.2V86H86.2V66.4L74.6 86H65.2L53.8 66.2V86H42z"
    fill="#D8A33D"
  />
  <!-- upward arrow from M right -->
  <path d="M86 52l12-14 4.5 4.5-6.2 6.2H108v6.4H86V52z" fill="#D8A33D"/>
  <!-- volume bars -->
  <rect x="48" y="34" width="4.5" height="10" rx="1.5" fill="#D8A33D"/>
  <rect x="55" y="28" width="4.5" height="16" rx="1.5" fill="#D8A33D"/>
  <rect x="62" y="22" width="4.5" height="22" rx="1.5" fill="#D8A33D"/>
  <!-- circuit nodes -->
  <path d="M58 86v12M64 86v16M70 86v12" stroke="#D8A33D" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="58" cy="100" r="2.4" fill="#D8A33D"/>
  <circle cx="64" cy="104" r="2.4" fill="#D8A33D"/>
  <circle cx="70" cy="100" r="2.4" fill="#D8A33D"/>
</svg>
